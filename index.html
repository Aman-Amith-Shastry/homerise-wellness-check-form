<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Check Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 40px 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            color: #d32f2f;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .form-card {
            background-color: #e8e8e8;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #999;
            border-radius: 4px;
            font-size: 14px;
            font-family: Arial, sans-serif;
            color: #333;
            background-color: #fff;
        }

        input[type="text"]::placeholder,
        select,
        textarea::placeholder {
            color: #999;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 20px;
            padding-right: 35px;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            padding: 12px;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #d32f2f;
            box-shadow: inset 0 0 0 1px #d32f2f;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background-color: #b71c1c;
        }

        .submit-btn:active {
            background-color: #9a1515;
        }

        .success-message {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #f5f5f5;
            border-radius: 4px;
            border-left: 4px solid #4caf50;
        }

        .checkmark {
            font-size: 48px;
            color: #4caf50;
            margin-bottom: 10px;
        }

        .success-message p {
            color: #333;
            font-weight: 600;
            margin: 0;
        }

        .completion-details {
            margin-bottom: 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #333;
        }

        .detail-value {
            color: #666;
            text-align: right;
        }

    </style>
</head>

                    </select>
                </div>

                <div class="form-group">
                    <label for="residentName">Resident Name</label>
                    <input type="text" id="residentName" name="residentName" placeholder="e.g. John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Resident Email</label>
                    <input type="email" id="email" name="email" placeholder="e.g. john.doe@example.com" required>
                </div>

                <div class="form-group">
                    <label for="hodName">HOD Name</label>
                    <input type="text" id="hodName" name="hodName" placeholder="e.g. Jane Smith" required>
                </div>

                <div class="form-group">
                    <label for="details">Wellness Check Details</label>
                    <textarea id="details" name="details" placeholder="Enter wellness check details..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit Wellness Check</button>
            </form>
        </div>

        <!-- Completion Screen -->
        <div id="completionScreen" class="form-card" style="display: none;">
            <div class="success-message">
                <div class="checkmark">✓</div>
                <p>Wellness check completed! Please remember to fill out the CIR.</p>
            </div>

            <div class="completion-details">
                <div class="detail-row">
                    <span class="detail-label">Date and Time Completed:</span>
                    <span class="detail-value" id="completionTime"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Site Name:</span>
                    <span class="detail-value" id="completionSite"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Resident:</span>
                    <span class="detail-value" id="completionResident"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">HOD Name:</span>
                    <span class="detail-value" id="completionHod"></span>
                </div>

                <div style="border-top: 2px solid #999; margin: 20px 0;"></div>

                <div class="detail-label">Wellness Check Details:</div>
                <div class="detail-value" id="completionDetails" style="margin-top: 10px; line-height: 1.6;"></div>
            </div>

            <button class="submit-btn" onclick="location.reload()">Return to Sign In</button>
        </div>
    </div>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { 
    doc, 
    updateDoc, 
    collection, 
    addDoc, 
    serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ---------------- Firebase Setup ---------------- */

const firebaseConfig = {
    apiKey: "AIzaSyBoZMRJHGBrYsv3z3Ls1MZDSiUTEjDxjPU",
  authDomain: "homerise-portal.firebaseapp.com",
  projectId: "homerise-portal",
};

// const firebaseConfig = {
//   apiKey: "AIzaSyBoZMRJHGBrYsv3z3Ls1MZDSiUTEjDxjPU",
//   authDomain: "homerise-portal.firebaseapp.com",
//   projectId: "homerise-portal",
//   storageBucket: "homerise-portal.firebasestorage.app",
//   messagingSenderId: "218556386496",
//   appId: "1:218556386496:web:ced25a39929792d80d3125"
// };

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ---------------- URL Params ---------------- */

const params = new URLSearchParams(window.location.search);

const siteId = params.get("siteId");
const residentId = params.get("residentId");
        
        // Function to get URL parameters
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                siteName: params.get('siteName') || '',
                siteId: params.get('siteId') || '',
                residentName: params.get('residentName') || '',
                residentId: params.get('residentId') || '',
                hodName: params.get('hodName') || '',
                details: params.get('details') || ''
            };
        }

        // Prefill form fields on page load
        window.addEventListener('DOMContentLoaded', function() {
            const params = getUrlParams();
            
            if (params.siteId) {
                document.getElementById('siteName').value = params.siteId;
            }
            if (params.residentName) {
                document.getElementById('residentName').value = params.residentName;
            }
            if (params.hodName) {
                document.getElementById('hodName').value = params.hodName;
            }
            if (params.details) {
                document.getElementById('details').value = params.details;
            }

        document.getElementById('wellnessForm').addEventListener('submit', async function(e) {
    //         e.preventDefault();
            
    //         const formData = {
    //             siteName: document.getElementById('siteName').value,
    //             residentName: document.getElementById('residentName').value,
    //             hodName: document.getElementById('hodName').value,
    //             details: document.getElementById('details').value
    //         };
            
    //         console.log('Form submitted:', formData);

    //          if (siteId && residentId) {

    //     const residentRef = doc(db, "sites", siteId, "residents", residentId);

    //     await updateDoc(residentRef, {
    //         state: true,
    //         last_check_in: new Date(),
    //         // last_hod: formData.hodName,
    //         notes: formData.details,
    //         wellnessCheck: formData.details
    //     });

    //     console.log("Resident state updated in Firestore");
    // }
    e.preventDefault();

    const formData = {
        siteName: document.getElementById('siteName').value,
        residentName: document.getElementById('residentName').value,
        hodName: document.getElementById('hodName').value,
        details: document.getElementById('details').value
    };

    console.log('Form submitted:', formData);

    try {
        if (siteId && residentId) {

            // 🔹 1. Reference to resident document
            const residentRef = doc(db, "sites", siteId, "residents", residentId);

            // 🔹 2. Reference to subcollection
            const wellnessRef = collection(residentRef, "wellnessChecks");

            // 🔹 3. Add a NEW entry (auto-creates collection if needed)
            await addDoc(wellnessRef, {
                details: formData.details,
                hodName: formData.hodName,
                createdAt: serverTimestamp()
            });

            console.log("Wellness check added");

            // 🔹 4. Update resident document
            await updateDoc(residentRef, {
                state: true,
                last_check_in: serverTimestamp(),
                last_hod: formData.hodName,
                notes: formData.details
            });

            console.log("Resident updated");
        } else {
            console.warn("Missing siteId or residentId");
        }

    } catch (error) {
        console.error("Error submitting wellness check:", error);
    }
            
            // Get current date and time
            const now = new Date();
            const dateTimeString = now.toLocaleString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
            
            // Update completion screen with form data
            document.getElementById('completionTime').textContent = dateTimeString;
            document.getElementById('completionSite').textContent = formData.siteName;
            document.getElementById('completionResident').textContent = formData.residentName;
            document.getElementById('completionHod').textContent = formData.hodName;
            document.getElementById('completionDetails').textContent = formData.details;
            
            // Switch screens
            document.getElementById('formScreen').style.display = 'none';
            document.getElementById('completionScreen').style.display = 'block';
            document.getElementById('pageTitle').textContent = 'Wellness Check Complete!';
        });
        });

    </script>
</body>
